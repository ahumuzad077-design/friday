<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y. | Digital Asset Checkout</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 400px; text-align: center; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
        button:hover { background: #2563eb; }
        .status { margin-top: 15px; font-size: 0.85rem; color: #94a3b8; word-break: break-all; }
        .highlight { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Ugandan Legal Kit</h2>
        <p>Instant digital download via Web3. Price: <span class="highlight">15 USDT / USDC</span></p>
        
        <button id="connectBtn" onclick="connectWallet()">Connect MetaMask</button>
        
        <div class="status" id="statusText">Wallet not connected.</div>
    </div>

    <script>
        const MERCHANT_WALLET = "YOUR_METAMASK_WALLET_ADDRESS_HERE"; // Replace with your actual address

        async function connectWallet() {
            const statusText = document.getElementById("statusText");
            const connectBtn = document.getElementById("connectBtn");

            if (typeof window.ethereum !== 'undefined') {
                try {
                    statusText.innerText = "Requesting connection...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAccount = accounts[0];

                    connectBtn.innerText = "Wallet Connected";
                    connectBtn.style.background = "#10b981";
                    statusText.innerHTML = `Connected: <span class="highlight">${userAccount}</span><br><br>Please send funds to merchant address:<br><span class="highlight">${MERCHANT_WALLET}</span>`;
                } catch (error) {
                    statusText.innerText = "Connection rejected by user.";
                }
            } else {
                statusText.innerText = "MetaMask not detected! Please open this page inside a Web3 browser or install MetaMask.";
            }
        }
    </script>

</body>
</html>
