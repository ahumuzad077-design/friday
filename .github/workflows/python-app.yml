name: Python application

on:
  push:
    branches: ["main-v3-mega", "friday-v3-10x-capital-engine"]
  pull_request:
    branches: ["main-v3-mega", "friday-v3-10x-capital-engine"]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements-v2.txt
      - name: Syntax and undefined-name checks
        run: flake8 friday_core tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Style checks
        run: flake8 friday_core tests --count --max-complexity=15 --max-line-length=180 --ignore=E231,C901 --statistics
      - name: Run tests
        run: pytest -q
      - name: Build V3 source bundle
        if: success()
        run: |
          rm -rf .git .github/actions
          zip -qr friday-v3-10x-capital-engine.zip . -x '*.pyc' -x '__pycache__/*' -x '.env' -x '.env.*.local'
      - name: Upload V3 source bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: friday-v3-10x-capital-engine
          path: friday-v3-10x-capital-engine.zip
          if-no-files-found: error
